<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Contact Us Form</title>

  <!-- CSS -->
  <link rel="stylesheet" href="styles.css">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

</head>
<body>
  <div class="container">

    <div class="left-side">

      <div class="address-cont">
        <i class="fa fa-map-marker"></i>
        <p class="title">Address</p>
        <p class="addr">Yerevan, Armenia</p>
        <p class="addr">Sebastia 30</p>
      </div>

      <div class="phone-cont">
        <i class="fa fa-phone"></i>
        <p class="title">Phone</p>
        <p>+374 77 344-878</p>
        <p>+374 77 344-878</p>
      </div>

      <div class="mail-cont">
        <i class="fas fa-envelope"></i>
        <p class="title">Email</p>
        <p class="addr">samvel.arakelyan00@gmail.com</p>
        <p class="addr">samvel.arakelyan00@gmail.com</p>
      </div>
    </div>

    <div class="right-side">
      
      <div class="title pre-title">
        <h3 class="title-h3">Send us a message</h3>
        <p>Lorem ipsum dolor, sit amet consectetur adipisicing elit. Velit quo hic, illum iure minima adipisci quibusdam quis ea</p>
      </div>

      <div class="form-wrapper">
        <form action="#">
          <div><input type="text" placeholder="Enter your name"></div>
          <div><input type="text" placeholder="Enter your email"></div>
          <div><input type="text" placeholder="Enter your message"></div>

          <div><a href="#">Send Now</a></div>
      </form>
      </div>
    </div>

  </div>
</body>
</html>
